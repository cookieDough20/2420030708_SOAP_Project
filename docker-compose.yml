# Runs a local PostgreSQL instance pre-configured with the 7 databases
# every backend microservice expects (see PROJECT_DOCUMENTATION.md / SETUP.md).
#
# Usage:
#   docker compose up -d
#
# This does NOT run the Java/Python/Node services themselves — only the
# database. See SETUP.md for how to run the rest of the stack.

services:
  postgres:
    image: postgres:16-alpine
    container_name: food-donation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
