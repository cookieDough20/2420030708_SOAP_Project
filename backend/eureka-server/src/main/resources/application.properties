spring.application.name=eureka-server

server.port=8761

# Eureka Server does not register itself
eureka.client.register-with-eureka=false

# Eureka Server does not fetch registry from another Eureka Server
eureka.client.fetch-registry=false

# Keep Eureka running even if services temporarily disappear
eureka.server.enable-self-preservation=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Ensure Eureka uses IP to prevent hostname URISyntaxException on Windows
eureka.instance.prefer-ip-address=true

eureka.instance.hostname=localhost
eureka.instance.instance-id=localhost:${server.port}
