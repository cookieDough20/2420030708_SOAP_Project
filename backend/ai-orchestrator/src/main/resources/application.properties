spring.application.name=ai-orchestrator

server.port=8087

# ==================================
# PostgreSQL
# ==================================

spring.datasource.url=jdbc:postgresql://localhost:5432/food_ai
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
# ==================================
# JPA
# ==================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================
# Eureka
# ==================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==================================
# FastAPI AI Service
# ==================================

ai.service.url=http://localhost:8000

# ==================================
# Actuator
# ==================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Ensure Eureka uses IP to prevent hostname URISyntaxException on Windows
eureka.instance.prefer-ip-address=true

eureka.instance.hostname=localhost
eureka.instance.instance-id=localhost:${server.port}
