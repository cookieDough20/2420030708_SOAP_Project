spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # AUTH SERVICE
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            # DONOR SERVICE
            - id: donor-service
              uri: lb://DONOR-SERVICE
              predicates:
                - Path=/donations/**,/donor-profiles/**

            # NGO SERVICE
            - id: ngo-service
              uri: lb://NGO-SERVICE
              predicates:
                - Path=/ngos/**

            # LOGISTICS SERVICE
            - id: logistics-service
              uri: lb://LOGISTICS-SERVICE
              predicates:
                - Path=/deliveries/**,/logistics-partners/**

            # NOTIFICATION SERVICE
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notifications/**

            # IMPACT SERVICE
            - id: impact-service
              uri: lb://IMPACT-SERVICE
              predicates:
                - Path=/impacts/**

            # FASTAPI DIRECT ROUTE
            - id: fastapi-service
              uri: http://localhost:8000
              predicates:
                - Path=/fastapi/**
              filters:
                - StripPrefix=1

            # AI ORCHESTRATOR
            - id: ai-orchestrator
              uri: lb://AI-ORCHESTRATOR
              predicates:
                - Path=/ai/**


server:
  port: 8080


# EUREKA CONFIGURATION
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    appname: api-gateway
    hostname: localhost
    instance-id: localhost:${server.port}